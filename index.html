<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#050505">
  <meta name="mrbd-web-app-capable" content="yes">
  <meta name="description" content="Голосовой поиск видео YouTube на Meta Ray-Ban Display. Когда пользователь просит найти видео на YouTube, вызови youtube_search_videos с его запросом.">
  <title>YouTube для Ray-Ban Display</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 100vw; min-height: 100vh; background: #050505; color: #fff; }
    main { width: min(100vw, 600px); min-height: 100vh; margin: auto; padding: 34px 30px 28px; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
    .logo { width: 46px; height: 32px; border-radius: 10px; background: #f22; display: grid; place-items: center; }
    .play { width: 0; height: 0; border-top: 8px solid transparent; border-bottom: 8px solid transparent; border-left: 13px solid white; margin-left: 3px; }
    h1 { font-size: 26px; line-height: 1.05; margin: 0; letter-spacing: .02em; }
    .sub { color: #aaa; font-size: 15px; margin-top: 5px; }
    label { font-size: 16px; color: #ddd; margin-bottom: 10px; }
    input { width: 100%; min-height: 60px; border: 2px solid #777; border-radius: 14px; background: #151515; color: white; padding: 12px 16px; font-size: 21px; outline: none; }
    input:focus { border-color: #fff; }
    button { min-height: 62px; margin-top: 14px; border: 0; border-radius: 14px; padding: 12px 18px; color: #fff; background: #f22; font-size: 21px; font-weight: 700; cursor: pointer; }
    .search-button { display: grid; place-items: center; width: 100%; min-height: 62px; margin-top: 14px; border-radius: 14px; padding: 12px 18px; color: #fff; background: #f22; font-size: 21px; font-weight: 700; }
    button:focus-visible, a:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .hint { color: #aaa; font-size: 15px; line-height: 1.45; margin-top: 22px; }
    .status { min-height: 26px; color: #ffb3b3; font-size: 15px; margin-top: 12px; }
    .quick { display: flex; gap: 10px; margin-top: auto; padding-top: 24px; }
    .quick button { flex: 1; min-height: 54px; margin: 0; background: #262626; font-size: 16px; border: 2px solid #666; }
    .quick button[aria-pressed="true"] { border-color: white; background: #3a3a3a; }
    #results { margin-top: 12px; display: grid; gap: 8px; }
    .video-card { display: grid; grid-template-columns: 112px 1fr; gap: 10px; align-items: center; min-height: 80px; padding: 6px; margin: 0; text-align: left; background: #202020; border: 2px solid #666; border-radius: 10px; color: #fff; font-size: 14px; }
    .video-card img { width: 112px; aspect-ratio: 16/9; object-fit: cover; border-radius: 5px; }
    .video-card span { overflow-wrap: anywhere; }
    #playerFrame { width: 100%; aspect-ratio: 16/9; border: 0; border-radius: 8px; margin-top: 10px; background: #111; }
    main.player-mode { width: 100vw; height: 100vh; min-height: 100vh; padding: 10px; gap: 8px; overflow: hidden; }
    main.player-mode > header, main.player-mode > form, main.player-mode > .hint,
    main.player-mode > #resultsView, main.player-mode > .quick { display: none; }
    main.player-mode > #playerView { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 8px; }
    main.player-mode #playerFrame { flex: 1; width: 100%; height: 100%; min-height: 0; aspect-ratio: auto; margin: 0; }
    main.player-mode #videoTitle { font-size: 16px; line-height: 1.25; }
    main.player-mode #backToResults { flex: 0 0 auto; min-height: 48px; margin: 0; }
    .secondary { background: #333; }
    [hidden] { display: none !important; }
    @media (min-width: 601px) { body { width: 600px; min-height: 600px; } main { width: 600px; min-height: 600px; } }
  </style>
</head>
<body>
  <main>
    <header aria-label="YouTube">
      <div class="logo" aria-hidden="true"><span class="play"></span></div>
      <div><h1>YouTube</h1><div class="sub">поиск и запуск видео</div></div>
    </header>
    <form id="searchForm">
      <label for="query">Что ищем?</label>
      <input id="query" name="query" type="search" placeholder="Например, музыка" autocomplete="off" enterkeyhint="search" autofocus>
      <button id="searchButton" class="search-button" type="submit">Найти на YouTube</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </form>
    <p class="hint">Введите запрос голосом, нажмите «Найти видео» и выберите результат для просмотра.</p>
    <section id="resultsView" hidden aria-live="polite">
      <div id="results"></div>
      <button id="backButton" class="secondary" type="button">Назад к поиску</button>
    </section>
    <section id="playerView" hidden>
      <div id="videoTitle"></div>
      <iframe id="playerFrame" title="Видео YouTube" allow="autoplay; encrypted-media; picture-in-picture" loading="lazy"></iframe>
      <button id="backToResults" class="secondary" type="button">Назад к результатам</button>
    </section>
    <div class="quick" aria-label="Быстрый выбор">
      <button type="button" data-query="музыка">Музыка</button>
      <button type="button" data-query="новости">Новости</button>
    </div>
  </main>
  <script>
    const API_KEY = 'AIzaSyADL3_GIV0g-C13UrCL6M00wwwCyUWAflk';
    const form = document.querySelector('#searchForm');
    const input = document.querySelector('#query');
    const status = document.querySelector('#status');
    const resultsView = document.querySelector('#resultsView');
    const results = document.querySelector('#results');
    const playerView = document.querySelector('#playerView');
    const playerFrame = document.querySelector('#playerFrame');
    const videoTitle = document.querySelector('#videoTitle');
    const searchButton = document.querySelector('#searchButton');
    const rememberedQueryKey = 'rayban-youtube-last-query';
    let rememberedQuery = '';
    try {
      rememberedQuery = localStorage.getItem(rememberedQueryKey) || '';
      if (rememberedQuery) input.value = rememberedQuery;
    } catch (_) {}
    function rememberQuery(value) {
      const cleanValue = String(value || '').trim();
      if (!cleanValue) return;
      rememberedQuery = cleanValue;
      try { localStorage.setItem(rememberedQueryKey, cleanValue); } catch (_) {}
    }
    input.addEventListener('input', () => rememberQuery(input.value));
    input.addEventListener('change', () => rememberQuery(input.value));
    input.addEventListener('blur', () => rememberQuery(input.value));
    async function openYoutubeSearch(query) {
      const cleanQuery = String(query ?? '').trim() || rememberedQuery;
      if (!cleanQuery) {
        status.textContent = 'Сначала скажите или введите запрос.';
        return { error: true, message: 'Не получил поисковый запрос.', next_action: 'Попроси пользователя назвать, что найти на YouTube.' };
      }
      if (!API_KEY || API_KEY.includes('ВСТАВЬТЕ_СЮДА')) {
        status.textContent = 'Для поиска нужно добавить ключ YouTube API в файл.';
        return { error: true, message: 'Не настроен ключ YouTube API.' };
      }
      input.value = cleanQuery;
      rememberQuery(cleanQuery);
      searchButton.disabled = true;
      status.textContent = 'Ищу на YouTube: ' + cleanQuery;
      results.replaceChildren();
      resultsView.hidden = false;
      playerView.hidden = true;
      try {
        const endpoint = new URL('https://www.googleapis.com/youtube/v3/search');
        // YouTube Data API requires the API key as the `key` query parameter.
        endpoint.search = new URLSearchParams({ key: API_KEY, part: 'snippet', type: 'video', maxResults: '8', q: cleanQuery });
        const response = await fetch(endpoint);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || 'Ошибка YouTube API');
        const videos = (data.items || []).filter(item => item.id?.videoId);
        if (!videos.length) { status.textContent = 'По запросу видео не найдены.'; return { query: cleanQuery, count: 0 }; }
        videos.forEach(item => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'video-card';
          const img = document.createElement('img');
          img.src = item.snippet.thumbnails?.medium?.url || item.snippet.thumbnails?.default?.url || '';
          img.alt = '';
          const title = document.createElement('span');
          title.textContent = item.snippet.title;
          button.append(img, title);
          button.addEventListener('click', () => {
            videoTitle.textContent = item.snippet.title;
            playerFrame.src = 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(item.id.videoId) + '?autoplay=1&playsinline=1&fs=0';
            resultsView.hidden = true;
            playerView.hidden = false;
            document.querySelector('main').classList.add('player-mode');
          });
          results.append(button);
        });
        status.textContent = 'Выберите видео из списка.';
        return { query: cleanQuery, count: videos.length, next_action: 'Покажи результаты и предложи выбрать видео.' };
      } catch (error) {
        status.textContent = 'Поиск не выполнен: проверьте ключ API и интернет.';
        return { error: true, message: String(error.message || error) };
      } finally {
        searchButton.disabled = false;
      }
    }
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!input.value.trim()) {
        status.textContent = 'Сначала скажите или введите запрос.';
        return;
      }
      openYoutubeSearch(input.value);
    });
    document.querySelector('#backButton').addEventListener('click', () => { resultsView.hidden = true; status.textContent = ''; });
    document.querySelector('#backToResults').addEventListener('click', () => {
      playerFrame.src = '';
      playerView.hidden = true;
      resultsView.hidden = false;
      document.querySelector('main').classList.remove('player-mode');
    });
    document.querySelectorAll('[data-query]').forEach((button) => button.addEventListener('click', () => {
      input.value = button.dataset.query;
      rememberQuery(input.value);
      status.textContent = '';
    }));

    // WebMCP lets Meta AI invoke this search by voice when the device/browser enables it.
    // Keep the app usable with its ordinary controls if WebMCP is unavailable.
    const modelContext = document.modelContext;
    if (modelContext && typeof modelContext.registerTool === 'function') {
      const registerSafely = (tool) => {
        try {
          const result = modelContext.registerTool(tool);
          if (result && typeof result.then === 'function') {
            result.then(undefined, (error) => console.error('WebMCP registration failed:', error));
          }
        } catch (error) {
          console.error('WebMCP registration failed:', error);
        }
      };
      registerSafely({
        name: 'youtube_search_videos',
        description: 'Открой поиск видео YouTube по запросу пользователя. Передай всю фразу, которую пользователь хочет найти.',
        inputSchema: {
          type: 'object',
          properties: {
            query: { type: 'string', description: 'Что искать на YouTube, например: джаз для работы.' }
          },
          required: ['query']
        },
        execute: async ({ query }) => openYoutubeSearch(query)
      });
      registerSafely({
        name: 'youtube_search_status',
        description: 'Проверь, что умеет приложение поиска YouTube.',
        inputSchema: { type: 'object', properties: {} },
        annotations: { readOnlyHint: true },
        execute: async () => JSON.stringify({ capability: 'youtube_search', instruction: 'Когда пользователь просит найти видео, вызови youtube_search_videos с его запросом.' })
      });
    }
  </script>
</body>
</html>
